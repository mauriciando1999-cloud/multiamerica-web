<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Cita | Multiamerica Vehículos</title>
    <meta name="description" content="Agenda tu visita a Multiamerica Vehículos en Quinta Crespo, Caracas, y conoce en persona los vehículos de tu interés.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --brand-orange: #d65127; --dark: #121212; }
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfc; overflow-x: hidden; }
        
        .step-content { display: none; }
        .step-content.active { display: block; animation: slideIn 0.4s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; border-radius: 12px; cursor: pointer; transition: all 0.2s; }
        .cal-day.selected { background: var(--brand-orange) !important; color: white; box-shadow: 0 4px 12px rgba(214, 81, 39,0.3); }
        .cal-day.disabled { color: #e0e0e0; cursor: not-allowed; text-decoration: line-through; }
        .cal-day.today { border: 2px solid var(--brand-orange); color: var(--brand-orange); }

        .time-marker { position: absolute; background: transparent; border: none; color: #ccc; font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 900; cursor: pointer; transition: all 0.3s; line-height: 1.2; text-align: center; }
        .time-marker.selected { color: var(--brand-orange); font-size: 13px; text-shadow: 0 0 10px rgba(214, 81, 39,0.2); }

        #tutorial-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 150; display: none; }
        .tutorial-highlight { 
            position: relative !important; 
            z-index: 160 !important; 
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.85), 0 0 40px rgba(214, 81, 39, 0.8) !important; 
            outline: 4px solid var(--brand-orange) !important;
            background-color: white !important; 
            border-radius: 24px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="pb-20">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="public-db.js"></script>

    <nav class="p-6 bg-white border-b flex justify-between items-center sticky top-0 z-50">
        <div class="flex flex-col">
            <p class="text-xl font-black italic uppercase leading-none">MULTI<span class="text-[#d65127]">AMERICA VEHÍCULOS</span></p>
            <span class="text-[7px] font-black tracking-[2px] uppercase opacity-30 mt-1">Sede Quinta Crespo</span>
        </div>
        <button onclick="iniciarTutorialCheckout()" class="bg-white border-2 border-gray-100 text-black px-3 py-2 rounded-xl flex items-center gap-2 shadow-sm hover:border-orange-500 transition-all active:scale-95 group">
            <span class="text-sm group-hover:animate-bounce">🎙️</span>
            <span class="text-[9px] font-black uppercase tracking-tighter">Guía Cita</span>
        </button>
    </nav>

    <main class="max-w-xl mx-auto px-6 py-10">
        <div class="flex gap-2 mb-10">
            <div id="dot-1" class="h-1.5 flex-1 bg-orange-500 rounded-full transition-all"></div>
            <div id="dot-2" class="h-1.5 flex-1 bg-gray-200 rounded-full transition-all"></div>
            <div id="dot-3" class="h-1.5 flex-1 bg-gray-200 rounded-full transition-all"></div>
        </div>

        <section id="step-1" class="step-content active">
            <h1 class="text-3xl font-black italic uppercase tracking-tighter mb-6">Tu Selección</h1>
            <div id="lista-checkout" class="space-y-4 mb-8 bg-white p-2 rounded-3xl"></div>
            <button onclick="irAPaso(2)" class="w-full bg-black text-white py-5 rounded-2xl font-black uppercase text-xs tracking-[3px] shadow-lg active:scale-95 transition-all">Siguiente: Elegir Horario</button>
        </section>

        <section id="step-2" class="step-content">
            <h2 class="text-3xl font-black italic uppercase tracking-tighter mb-6 text-center text-gray-900">Agenda Tu Visita</h2>
            
            <div id="calendar-container" class="bg-white p-6 rounded-[32px] shadow-sm border border-gray-100 mb-8">
                <div class="flex justify-between items-center mb-6">
                    <h3 id="mes-nombre" class="font-black uppercase italic text-orange-600 text-sm">Abril 2026</h3>
                    <div class="flex gap-4">
                        <button onclick="cambiarMes(-1)" class="text-gray-400 font-black">❮</button>
                        <button onclick="cambiarMes(1)" class="text-gray-400 font-black">❯</button>
                    </div>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-[9px] font-black text-gray-300 mb-2 uppercase">
                    <div>Dom</div><div>Lun</div><div>Mar</div><div>Mie</div><div>Jue</div><div>Vie</div><div>Sab</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>
                <input type="hidden" id="fecha-final">
            </div>

            <div id="tacometro-box" class="flex flex-col items-center py-8 bg-white rounded-[32px] border border-gray-100 shadow-sm">
                <span class="text-[10px] font-black uppercase text-gray-400 tracking-[3px] mb-10">Selector de Hora (RPM)</span>
                <div class="relative w-64 h-64 flex items-center justify-center">
                    <div class="absolute inset-0 border-[8px] border-gray-50 rounded-full bg-white shadow-inner"></div>
                    <div id="markers-container" class="absolute inset-0">
                        <button class="time-marker" data-deg="-90" style="top: 50%; left: 12%; transform: translate(-50%, -50%);"></button>
                        <button class="time-marker" data-deg="-45" style="top: 25%; left: 25%; transform: translate(-50%, -50%);"></button>
                        <button class="time-marker" data-deg="0"   style="top: 15%; left: 50%; transform: translate(-50%, -50%);"></button>
                        <button class="time-marker" data-deg="45"  style="top: 25%; left: 75%; transform: translate(-50%, -50%);"></button>
                        <button class="time-marker" data-deg="90"  style="top: 50%; left: 88%; transform: translate(-50%, -50%);"></button>
                    </div>
                    <div id="aguja" class="absolute bg-orange-500 rounded-full" style="width: 4px; height: 90px; bottom: 50%; left: 50%; transform: translateX(-50%) rotate(-90deg); transform-origin: bottom center; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);"></div>
                    <div class="absolute w-6 h-6 bg-black rounded-full z-20 border-4 border-gray-800"></div>
                </div>
                <div id="display-hora-box" onclick="checkTutorialStep4()" class="mt-8 px-8 py-3 bg-white rounded-full border-2 border-orange-500 shadow-sm cursor-pointer">
                    <span id="display-hora" class="font-black text-orange-600 italic uppercase tracking-widest text-lg">--:-- --</span>
                </div>
            </div>

            <button onclick="irAPaso(3)" class="w-full bg-black text-white py-5 rounded-2xl font-black uppercase text-xs tracking-[3px] mt-8 shadow-lg">Siguiente: Ubicación</button>
        </section>

        <section id="step-3" class="step-content">
            <div id="mapa-box" class="bg-white p-4 rounded-[35px] border border-gray-100 shadow-sm mb-8 text-center">
                <h2 class="text-2xl font-black italic uppercase tracking-tighter mb-2">Te Esperamos</h2>
                <p class="text-gray-400 text-[10px] mb-4 uppercase tracking-widest">Quinta Crespo, Caracas.</p>
                <div class="rounded-[25px] overflow-hidden h-64 border-4 border-gray-50 bg-gray-100 flex items-center justify-center">
                     <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3923.1128124729257!2d-66.92193882348623!3d10.491772364376692!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8c2a5f495101b0dd%3A0xbfcebe2a2fd38d3!2sMULTIAMERICAVEHICULOS%20Quinta%20Crespo!5e0!3m2!1ses-419!2sve!4v1775521330032!5m2!1ses-419!2sve" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>

            <button id="btn-final" onclick="procesarCitaYAsignarGerente()" class="w-full bg-black text-white py-6 rounded-[24px] font-black uppercase text-xs tracking-[3px] shadow-xl active:scale-95 transition-all flex items-center justify-center gap-3">
                <span>Confirmar Cita Especial</span><span class="text-lg">➔</span>
            </button>
        </section>

        <button onclick="regresarAlShowroom()" class="w-full mt-10 py-4 text-[10px] font-black uppercase tracking-[2px] text-gray-400 border-2 border-gray-100 border-dashed rounded-[24px] hover:bg-gray-50 transition-all">← Volver al Showroom</button>
    </main>

    <div id="tutorial-overlay" onclick="siguientePasoSiEsManual()"></div>
    <div id="tutorial-bubble" class="fixed shadow-2xl bg-white p-6 rounded-[35px] w-[300px] border-4 border-black z-[200]" style="display:none;">
        <p id="tutorial-text" class="text-sm font-bold text-gray-900 leading-tight mb-4"></p>
        <button id="btn-tutorial-next" onclick="siguientePaso()" class="w-full bg-black text-white py-3 rounded-2xl font-black uppercase text-[10px] tracking-widest active:scale-95 transition-all">ENTENDIDO ➔</button>
    </div>
    <audio id="guia-audio" preload="auto"></audio>

    <script>
    let carrito = JSON.parse(sessionStorage.getItem("carrito_multiamerica")) || [];
    let currentMonth = new Date(); // Empezamos en el mes actual real
    let horaSeleccionada = "";
    let indicePaso = 0;

    const pasosTutorialCheckout = [
        { id: 'lista-checkout', texto: "🏁 PASO 1: Verifica que tus Vehiculos seleccionados estén correctas.", audio: 'paso5.mp3', step: 1, manual: true },
        { id: 'calendar-container', texto: "📅 PASO 2: Selecciona la fecha de tu visita en el calendario.", audio: 'paso6.mp3', step: 2, manual: false },
        { id: 'tacometro-box', texto: "🏎️ PASO 3: Elige tu horario ideal moviendo la aguja del tacómetro.", audio: 'paso7.mp3', step: 2, manual: false },
        { id: 'display-hora-box', texto: "⏰ PASO 4: Confirma que la hora marcada sea la correcta.", audio: 'paso8.mp3', step: 2, manual: true },
        { id: 'mapa-box', texto: "📍 PASO 5: ¡Aquí estamos! Te esperamos en nuestra sede de Quinta Crespo.", audio: 'paso9.mp3', step: 3, manual: true }
    ];

    function obtenerUrlFotoLocal(fotoPath) {
        if (!fotoPath) return 'https://placehold.co/400x300?text=No+Image';
        if (fotoPath.startsWith('http')) return fotoPath;
        const baseStorage = (typeof window.CONFIG_DB !== 'undefined') ? 
            `${window.CONFIG_DB.SUPABASE_URL}/storage/v1/object/public/autos/` : 
            "https://zamiahmbgwqiralxinju.supabase.co/storage/v1/object/public/autos/";
        return baseStorage + fotoPath;
    }

    function renderCheckout() {
        const lista = document.getElementById('lista-checkout');
        if (!carrito || carrito.length === 0) {
            lista.innerHTML = `<div class="p-10 text-center opacity-30 font-bold italic">Tu garaje está vacío</div>`;
            return;
        }

        lista.innerHTML = carrito.map((carro, i) => {
            let fotoUrl = 'https://placehold.co/200x200?text=Auto';
            if (carro.fotos && carro.fotos.length > 0) fotoUrl = obtenerUrlFotoLocal(carro.fotos[0]);
            else if (carro.foto) fotoUrl = obtenerUrlFotoLocal(carro.foto);

            return `
                <div class="flex items-center gap-4 bg-white p-4 rounded-3xl border border-gray-100 shadow-sm mb-3">
                    <div class="w-20 h-20 rounded-2xl overflow-hidden bg-gray-50 flex-shrink-0 border border-gray-100">
                        <img src="${fotoUrl}" alt="${carro.marca} ${carro.modelo}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/200x200?text=Auto';">
                    </div>
                    <div class="flex-1">
                        <h4 class="font-black uppercase text-[11px] italic leading-tight text-gray-900">
                            ${carro.marca} <span class="text-orange-500">${carro.modelo}</span>
                        </h4>
                        <p class="text-[10px] text-gray-400 font-bold mt-1 uppercase tracking-tighter">
                            $${Number(carro.precio_venta || carro.precio || 0).toLocaleString('es-CL')}
                        </p>
                    </div>
                    <button onclick="removerAuto(${i})" class="bg-gray-50 text-gray-300 hover:text-red-500 p-2.5 rounded-xl transition-all">✕</button>
                </div>
            `;
        }).join('');
    }

    function removerAuto(index) {
        carrito.splice(index, 1);
        sessionStorage.setItem("carrito_multiamerica", JSON.stringify(carrito));
        renderCheckout();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        const mesTxt = document.getElementById('mes-nombre');
        grid.innerHTML = '';
        const mes = currentMonth.getMonth();
        const anio = currentMonth.getFullYear();
        const nombreMes = new Intl.DateTimeFormat('es-VE', { month: 'long' }).format(currentMonth);
        mesTxt.innerText = `${nombreMes.toUpperCase()} ${anio}`;
        
        const primerDia = new Date(anio, mes, 1).getDay();
        const totalDias = new Date(anio, mes + 1, 0).getDate();
        const hoy = new Date(); 
        hoy.setHours(0,0,0,0);

        for(let i=0; i<primerDia; i++) grid.innerHTML += '<div></div>';
        for(let d=1; d<=totalDias; d++) {
            const fecha = new Date(anio, mes, d);
            const esInvalido = fecha.getDay() === 0 || fecha < hoy;
            const diaEl = document.createElement('div');
            diaEl.className = `cal-day ${esInvalido ? 'disabled' : ''}`;
            diaEl.innerText = d;
            
            if(!esInvalido) {
                diaEl.onclick = () => {
                    document.querySelectorAll('.cal-day').forEach(el => el.classList.remove('selected'));
                    diaEl.classList.add('selected');
                    document.getElementById('fecha-final').value = `${d}/${mes+1}/${anio}`;
                    pintarMarkers(fecha.getDay() === 6);
                    if (document.getElementById('tutorial-overlay').style.display === 'block' && indicePaso === 1) setTimeout(siguientePaso, 400);
                };
            }
            grid.appendChild(diaEl);
        }
    }

    function cambiarMes(dir) { 
        currentMonth.setMonth(currentMonth.getMonth() + dir); 
        renderCalendar(); 
    }

    // Horarios reales de atencion (ver imagen de horarios): L-V 9am-5pm,
    // Sabados 9am-2pm. Los 5 marcadores del tacometro se repintan segun el
    // dia elegido para que sea imposible seleccionar una hora fuera de rango.
    const HORAS_SEMANA = ['09:00 AM', '11:00 AM', '01:00 PM', '03:00 PM', '04:00 PM'];
    const HORAS_SABADO = ['09:00 AM', '10:00 AM', '11:00 AM', '12:00 PM', '01:00 PM'];

    function pintarMarkers(esSabado) {
        const horas = esSabado ? HORAS_SABADO : HORAS_SEMANA;
        document.querySelectorAll('#markers-container .time-marker').forEach((btn, i) => {
            const [hh, ampm] = horas[i].split(' ');
            btn.innerHTML = `${hh}<br>${ampm}`;
            btn.onclick = () => setHora(btn, Number(btn.dataset.deg), horas[i]);
            btn.classList.remove('selected');
        });
        document.getElementById('aguja').style.transform = 'translateX(-50%) rotate(-90deg)';
        horaSeleccionada = '';
        document.getElementById('display-hora').innerText = '--:-- --';
    }

    function setHora(btn, deg, hora) {
        document.getElementById('aguja').style.transform = `translateX(-50%) rotate(${deg}deg)`;
        document.querySelectorAll('.time-marker').forEach(m => m.classList.remove('selected'));
        btn.classList.add('selected');
        horaSeleccionada = hora;
        document.getElementById('display-hora').innerText = hora;
        if (document.getElementById('tutorial-overlay').style.display === 'block' && indicePaso === 2) setTimeout(siguientePaso, 500);
    }

    function irAPaso(step) {
        document.querySelectorAll('.step-content').forEach(s => s.classList.remove('active'));
        document.getElementById(`step-${step}`).classList.add('active');
        for(let i=1; i<=3; i++) {
            document.getElementById(`dot-${i}`).classList.toggle('bg-orange-500', i <= step);
            document.getElementById(`dot-${i}`).classList.toggle('bg-gray-200', i > step);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // NUEVA FUNCIÓN: PROCESAR CITA Y MOSTRAR MODAL VIP
    async function procesarCitaYAsignarGerente() {
        const fecha = document.getElementById('fecha-final').value;
        const hora = document.getElementById('display-hora').innerText;

        if (!fecha || !hora || hora === "--:-- --") {
            return alert("⚠️ Por favor, selecciona una fecha y hora en el paso 2 para tu cita.");
        }

        if (carrito.length === 0) {
            return alert("🛒 Tu carrito está vacío.");
        }

        try {
            // Efecto de carga en el botón
            const btn = document.getElementById('btn-final');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span>Asignando Gerente...</span><span class="animate-spin text-lg">⚙️</span>`;

            const client = (typeof _supabase !== 'undefined') ? _supabase : supabase;

            // Buscar vendedores (vista publica; 'vendedores' no es legible por
            // anonimos). Incluye gerentes Y asesores, para que el enlace
            // personal de un asesor tambien se respete.
            const { data: vendedores, error } = await client
                .from('lista_vendedores')
                .select('slug, nombre, apellido, whatsapp, rol');

            let gerenteAsignado = { nombre: "Gerente", apellido: "De Guardia", whatsapp: "584120000000" };

            // Si el cliente llego por el enlace personal de un vendedor
            // (showroom.html?v=slug), se lo asignamos a el en vez de al azar.
            // Sin enlace, el azar solo elige entre gerentes.
            if (!error && vendedores && vendedores.length > 0) {
                const miVendedor = sessionStorage.getItem('last_vendedor');
                const match = miVendedor ? vendedores.find(v => v.slug === miVendedor) : null;
                const gerentes = vendedores.filter(v => v.rol === 'gerente');
                gerenteAsignado = match || (gerentes.length > 0 ? gerentes[Math.floor(Math.random() * gerentes.length)] : gerenteAsignado);
            }

            // Dejamos registro del lead y notificamos al gerente (Edge Function
            // con service_role: busca su email server-side y le manda el correo).
            try {
                await client.functions.invoke('registrar-lead-showroom', {
                    body: {
                        tipo: 'Cita',
                        vehiculos: carrito.map(c => `${c.marca} ${c.modelo} ${c.anio}`),
                        vehiculo_ids: carrito.map(c => c.id).filter(Boolean),
                        gerente_slug: gerenteAsignado.slug || null,
                        fecha_hora: `${fecha} ${hora}`,
                        ubicacion: 'Sede Quinta Crespo, Caracas'
                    }
                });
            } catch (e) { console.warn('No se pudo registrar el lead:', e); }

            btn.innerHTML = originalText;
            mostrarModalGerente(gerenteAsignado, fecha, hora);

        } catch (err) {
            console.error("Error asignando:", err);
            alert("Error de conexión al asignar gerente, intenta nuevamente.");
            document.getElementById('btn-final').innerHTML = `<span>Confirmar Cita Especial</span><span class="text-lg">➔</span>`;
        }
    }

    function mostrarModalGerente(gerente, fecha, hora) {
        const cleanNum = gerente.whatsapp.replace(/\D/g, '');
        const listaAutos = carrito.map(c => `🏎️ *${c.marca} ${c.modelo}*`).join('%0A');
        
        // Mensaje pre-armado para el botón de WhatsApp final
        const textoWa = `¡Hola ${gerente.nombre}! Vengo del Showroom VIP y me han asignado contigo para mi cita:%0A%0A📅 *FECHA:* ${fecha}%0A⏰ *HORA:* ${hora}%0A%0A*Vehículos a evaluar:*%0A${listaAutos}%0A%0A¿Podrías confirmarme tu disponibilidad?`;
        const linkWa = `https://wa.me/${cleanNum}?text=${textoWa}`;

        const modalHtml = `
        <div id="modal-gerente" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-[300] flex items-center justify-center p-6">
            <div class="bg-white rounded-[35px] p-8 max-w-sm w-full text-center shadow-2xl border-4 border-gray-100 transform scale-100 transition-all duration-300">
                <div class="w-16 h-16 bg-orange-50 text-[#d65127] rounded-full flex items-center justify-center mx-auto text-3xl mb-4 shadow-inner">
                    ⭐️
                </div>
                <h3 class="font-black text-2xl uppercase italic tracking-tighter text-gray-900 leading-none">Cita <span class="text-[#d65127]">Aprobada</span></h3>
                <p class="text-[10px] text-gray-500 font-bold mt-3 leading-relaxed uppercase tracking-widest">Te hemos asignado a un directivo para tu atención exclusiva.</p>
                
                <div class="bg-gray-50 border border-gray-100 rounded-[24px] p-5 my-6 text-left flex flex-col gap-1 shadow-inner">
                    <span class="text-[9px] font-black uppercase text-gray-400 tracking-[2px]">Asesor Asignado</span>
                    <span class="font-black text-lg text-black uppercase italic tracking-tighter">${gerente.nombre} ${gerente.apellido}</span>
                    <span class="text-[9px] font-black uppercase text-gray-400 tracking-[2px] mt-3">Línea Directa</span>
                    <span class="font-bold text-sm text-[#d65127] mt-0.5">${gerente.whatsapp}</span>
                </div>

                <a href="${linkWa}" target="_blank" onclick="cerrarModalYLimpiar()" class="w-full bg-[#25D366] text-white py-5 rounded-2xl font-black uppercase text-[11px] tracking-[2px] shadow-xl active:scale-95 transition-all flex items-center justify-center gap-3">
                    💬 Confirmar con Gerente
                </a>
                
                <button onclick="document.getElementById('modal-gerente').remove()" class="mt-5 text-[9px] font-black uppercase tracking-widest text-gray-400 hover:text-black transition-all">
                    Cancelar
                </button>
            </div>
        </div>`;

        document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function cerrarModalYLimpiar() {
        document.getElementById('modal-gerente')?.remove();
        sessionStorage.removeItem("carrito_multiamerica");
        // Esperamos un segundo para que se abra la pestaña de WhatsApp antes de redirigir
        setTimeout(() => { window.location.href = 'showroom.html'; }, 1000);
    }

    /* ====== FUNCIONES DEL TUTORIAL (Mantenidas intactas) ====== */
    function iniciarTutorialCheckout() {
        indicePaso = 0;
        document.getElementById('tutorial-overlay').style.display = 'block';
        mostrarPasoActualCheckout();
    }

    function mostrarPasoActualCheckout() {
        const config = pasosTutorialCheckout[indicePaso];
        if(config.step) irAPaso(config.step);
        document.querySelectorAll('.tutorial-highlight').forEach(el => el.classList.remove('tutorial-highlight'));
        setTimeout(() => {
            const target = document.getElementById(config.id);
            const bubble = document.getElementById('tutorial-bubble');
            if (target && bubble) {
                target.classList.add('tutorial-highlight');
                document.getElementById('tutorial-text').innerHTML = `<span class="text-orange-500 font-black block mb-1 uppercase text-[10px]">MULTIAMERICA GUÍA</span>${config.texto}`;
                document.getElementById('btn-tutorial-next').style.display = config.manual ? 'block' : 'none';
                bubble.style.display = 'block';
                const rect = target.getBoundingClientRect();
                bubble.style.top = `${(rect.top < 220) ? (rect.bottom + window.scrollY + 20) : (rect.top + window.scrollY - 200)}px`;
                bubble.style.left = `${Math.max(20, Math.min(rect.left, window.innerWidth - 320))}px`;
                const audio = document.getElementById('guia-audio');
                audio.src = `./audio/${config.audio}`;
                audio.play().catch(()=>{});
            }
        }, 600);
    }

    function siguientePaso() {
        indicePaso++;
        if (indicePaso < pasosTutorialCheckout.length) mostrarPasoActualCheckout();
        else cerrarTutorial();
    }

    function siguientePasoSiEsManual() {
        const config = pasosTutorialCheckout[indicePaso];
        if (config && config.manual) siguientePaso();
    }

    function cerrarTutorial() {
        document.getElementById('tutorial-overlay').style.display = 'none';
        document.getElementById('tutorial-bubble').style.display = 'none';
        document.querySelectorAll('.tutorial-highlight').forEach(el => el.classList.remove('tutorial-highlight'));
    }

    function regresarAlShowroom() {
        const vSlug = sessionStorage.getItem('last_vendedor');
        window.location.href = vSlug ? `showroom.html?v=${vSlug}` : 'showroom.html';
    }

    document.addEventListener("DOMContentLoaded", () => {
        renderCheckout();
        renderCalendar();
        pintarMarkers(false);
    });
    </script>
</body>
</html>
