<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admisión Elite | Multiamerica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; color: #fff; margin: 0; overflow-x: hidden; background-color: #050505; }
        
        /* CAPAS DE FONDO (VIDEO + OVERLAY + GRID) */
        .video-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: -3;
        }
        .video-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 5, 0.85); /* Oscurece el video para legibilidad */
            z-index: -2;
        }
        .bg-grid { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: radial-gradient(circle, rgba(255,136,1,0.15) 1px, transparent 1px); 
            background-size: 40px 40px; 
            z-index: -1; pointer-events: none;
        }

        /* ESTILOS DE INPUTS */
        .input-box {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem; border-radius: 16px; width: 100%; color: #fff; outline: none; transition: 0.3s;
        }
        .input-box:focus { border-color: #ff8801; background: rgba(255, 136, 1, 0.05); box-shadow: 0 0 15px rgba(255,136,1,0.1); }
        
        /* ANIMACIÓN MODAL */
        .modal-enter { animation: modalFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalFade {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen py-12 px-4 relative flex items-center justify-center">

    <video class="video-bg" autoplay muted loop playsinline poster="thumb-elite.jpg">
        <source src="video-fondo.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
    <div class="bg-grid"></div>

    <main class="max-w-3xl w-full relative z-10">
        <header class="text-center mb-12">
            <h2 class="text-5xl font-black italic uppercase tracking-tighter">Ficha de <span class="text-[#ff8801]">Admisión</span></h2>
            <p class="text-gray-500 text-[10px] mt-4 uppercase tracking-[0.4em] font-bold">Sistema de Reclutamiento AI</p>
        </header>

        <form id="form-postulante" class="bg-[#0a0a0a]/60 backdrop-blur-3xl border border-white/10 p-8 md:p-14 rounded-[50px] shadow-2xl space-y-8">
            
            <div class="flex flex-col items-center">
                <div class="w-32 h-32 rounded-full border-2 border-dashed border-[#ff8801] flex items-center justify-center overflow-hidden bg-white/5 cursor-pointer relative group transition-all hover:bg-white/10 hover:scale-105" onclick="document.getElementById('v-foto').click()">
                    <img id="preview-foto" class="hidden w-full h-full object-cover">
                    <span id="label-foto" class="text-[9px] font-black uppercase text-gray-400 text-center group-hover:text-white transition-colors">Subir Foto</span>
                </div>
                <input type="file" id="v-foto" class="hidden" accept="image/*" required>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="text" id="v-nombre" class="input-box" placeholder="Nombre" required>
                <input type="text" id="v-apellido" class="input-box" placeholder="Apellido" required>
                <input type="correo" id="v-correo" class="input-box md:col-span-2" placeholder="Correo Electrónico" required>
                <input type="tel" id="v-telefono" class="input-box" placeholder="WhatsApp (Ej. 04141234567)" required>
                <input type="text" id="v-experiencia" class="input-box" placeholder="Años de experiencia" required>
            </div>

            <div class="border-2 border-dashed border-white/10 rounded-2xl p-8 text-center cursor-pointer hover:border-[#ff8801] transition-all bg-white/5 hover:bg-[#ff8801]/5" onclick="document.getElementById('v-cv').click()">
                <input type="file" id="v-cv" class="hidden" accept=".pdf" required>
                <p id="label-cv" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest italic">Adjuntar CV (Formato PDF)</p>
            </div>

            <textarea id="v-descripcion" class="input-box h-32 resize-none" placeholder="Descripción profesional (Destaca tus habilidades principales)..." required></textarea>

            <button type="submit" class="w-full bg-[#ff8801] text-black font-black uppercase italic tracking-[0.2em] py-5 rounded-2xl hover:bg-white transition-all transform active:scale-95 shadow-[0_0_30px_rgba(255,136,1,0.2)] hover:shadow-[0_0_40px_rgba(255,255,255,0.4)]">
                Enviar Aplicación ➔
            </button>
        </form>
    </main>

    <div id="modal-exito" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#0a0a0a] border border-white/10 max-w-md w-full rounded-[40px] p-10 text-center modal-enter shadow-[0_0_50px_rgba(255,136,1,0.1)]">
            <div class="w-20 h-20 border-2 border-dashed border-[#ff8801] rounded-full flex items-center justify-center mx-auto mb-6 bg-[#ff8801]/10">
                <i class="fa-solid fa-check text-2xl text-[#ff8801]"></i>
            </div>
            <h2 class="text-2xl font-black uppercase italic mb-4">Aplicación Recibida</h2>
            <p class="text-gray-400 text-sm leading-relaxed mb-8">
                Tu ficha de admisión y documentos han sido enviados a nuestro sistema de evaluación.<br><br>
                <span class="text-white font-bold tracking-wide">Te notificaremos los resultados y siguientes pasos a tu correo electrónico.</span>
            </p>
            <button onclick="cerrarModal()" class="w-full bg-[#ff8801] text-black py-4 rounded-2xl font-black uppercase tracking-widest text-[10px] hover:bg-white transition-all">
                Entendido
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="public-db.js"></script>

    <script>
        // VALIDACIÓN DE LLAVES
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof CONFIG === 'undefined') {
                console.error("❌ ERROR: No se detectó CONFIG en public-db.js. Verifica el nombre del archivo.");
                return;
            }

            const _supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

            // Previews
            document.getElementById('v-foto').onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    document.getElementById('preview-foto').src = URL.createObjectURL(file);
                    document.getElementById('preview-foto').classList.remove('hidden');
                    document.getElementById('label-foto').classList.add('hidden');
                }
            };

            document.getElementById('v-cv').onchange = (e) => {
                if(e.target.files.length > 0) {
                    document.getElementById('label-cv').innerHTML = `<span class="text-[#ff8801]">✓</span> ${e.target.files[0].name}`;
                    document.getElementById('label-cv').classList.replace('text-gray-400', 'text-white');
                }
            };

            // Envío de Formulario
            const form = document.getElementById('form-postulante');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = form.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                btn.disabled = true; 
                btn.innerText = "Sincronizando Datos...";

                try {
                    const cvFile = document.getElementById('v-cv').files[0];
                    const fotoFile = document.getElementById('v-foto').files[0];

                    // 1. Storage Upload
                    const cvPath = `cv_${Date.now()}_${cvFile.name.replace(/\s/g, '_')}`;
                    const { data: dCv, error: eCv } = await _supabase.storage.from('curriculums').upload(cvPath, cvFile);
                    if (eCv) throw eCv;

                    const fotoPath = `foto_${Date.now()}_${fotoFile.name.replace(/\s/g, '_')}`;
                    const { data: dFo, error: eFo } = await _supabase.storage.from('vendedores_fotos').upload(fotoPath, fotoFile);
                    if (eFo) throw eFo;

                    // 2. Insertar en Base de Datos (Ahora incluye Email)
                    const { error: eDb } = await _supabase.from('postulantes').insert([{
                        nombre: document.getElementById('v-nombre').value.trim(),
                        apellido: document.getElementById('v-apellido').value.trim(),
                        correo: document.getElementById('v-correo').value.trim(),
                        telefono: document.getElementById('v-telefono').value.trim(),
                        experiencia_declarada: document.getElementById('v-experiencia').value.trim(),
                        descripcion_perfil: document.getElementById('v-descripcion').value.trim(),
                        cv_url: dCv.path,
                        foto_url: dFo.path,
                        contratacion: 'evaluado',
                        habilidades_ia: null,
                        resumen_ia: null
                    }]);

                    if (eDb) throw eDb;

                    // Mostrar modal estético en lugar de alerta fea
                    document.getElementById('modal-exito').classList.remove('hidden');

                } catch (err) {
                    console.error(err);
                    alert("Error al procesar la aplicación: " + err.message);
                    btn.disabled = false; 
                    btn.innerHTML = originalText;
                }
            });
        });

        // Función para el botón del Modal
        function cerrarModal() {
            document.getElementById('modal-exito').classList.add('hidden');
            window.location.reload(); // Recarga limpia tras confirmar
        }
    </script>
</body>
</html>
